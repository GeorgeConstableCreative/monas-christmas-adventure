<title>Mona's Christmas Adventure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{--bg:#2b1d1a;--cream:#fffaf0;--red:#c8453b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#2b1d1a}}

html,body{margin:0;height:100%;background:var(--bg);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
canvas{position:absolute;display:block;touch-action:none}
#rotate{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:var(--bg);color:var(--cream);font-family:Fredoka,system-ui,sans-serif;text-align:center;z-index:5;padding:16px}

#rotate h2{margin:6px 0 0;font-weight:600;font-size:26px}
#rotate p{margin:0;opacity:.8;font-size:18px}

<body>
<style>:root{--sat:env(safe-area-inset-top);--sab:env(safe-area-inset-bottom)}</style><canvas id="game"></canvas>
<div id="rotate"><div class="ipad"></div><h2>Turn your iPad sideways</h2><p>Mona's Christmas Adventure plays best in landscape.</p><button onclick="var r=document.getElementById('rotate');r.dismissed=true;r.style.display='none'">Play anyway</button></div>
<script>
'use strict';
/* ============ CONFIG: easy to change ============ */
const CARD = {
  words: ['MERRY', 'CHRISTMAS', 'SAMANTHA', 'LOVE', 'YOU', 'ALWAYS', 'MONA'],
  lines: ['Merry Christmas,', 'Samantha!', 'I love you, always.'],
  signoff: 'Love, George & Mona xx'
};

/* ============ Canvas + scaling ============ */
const W = 1240, H = 900, TAU = Math.PI * 2;
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let K = 1, DPR = 1, viewScale = 1;
const cacheStore = new Map();

function resize() {
  const vw = window.innerWidth, vh = window.innerHeight;
  viewScale = Math.min(vw / W, vh / H);
  const cw = Math.floor(W * viewScale), ch = Math.floor(H * viewScale);
  cv.style.width = cw + 'px'; cv.style.height = ch + 'px';
  cv.style.left = Math.floor((vw - cw) / 2) + 'px';
  cv.style.top = Math.floor((vh - ch) / 2) + 'px';
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(cw * DPR); cv.height = Math.round(ch * DPR);
  K = cv.width / W;
  cacheStore.clear();
  const rot = document.getElementById('rotate');
  if (rot && !rot.dismissed) rot.style.display = (vh > vw * 1.05) ? 'flex' : 'none';
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));

function cached(key, w, h, fn) {
  let c = cacheStore.get(key);
  if (!c) {
    c = document.createElement('canvas');
    const R = cacheRes(w, h); c.width = Math.max(1, Math.ceil(w * R)); c.height = Math.max(1, Math.ceil(h * R));
    const g = c.getContext('2d');
    g.setTransform(R, 0, 0, R, 0, 0);
    fn(g, w, h);
    cacheStore.set(key, c);
  }
  return c;
}

/* ============ Math + drawing helpers ============ */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const dist = (x1, y1, x2, y2) => Math.hypot(x2 - x1, y2 - y1);
const E = {
  out: t => 1 - Math.pow(1 - clamp(t, 0, 1), 3),
  inOut: t => { t = clamp(t, 0, 1); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; },
  back: t => { t = clamp(t, 0, 1); const c1 = 1.5, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); },
  spring: t => { t = clamp(t, 0, 2); return 1 - Math.exp(-7 * t) * Math.cos(10 * t); },
  sine: t => -(Math.cos(Math.PI * clamp(t, 0, 1)) - 1) / 2
};
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function rr(g, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  g.beginPath(); g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function ell(g, x, y, rx, ry, rot) { g.beginPath(); g.ellipse(x, y, Math.abs(rx), Math.abs(ry), rot || 0, 0, TAU); }
function circ(g, x, y, r) { g.beginPath(); g.arc(x, y, Math.abs(r), 0, TAU); }
let INK = false;
function fillP(g, c) { g.fillStyle = c; g.fill(); if (INK) { g.lineJoin = 'round'; g.strokeStyle = 'rgba(27,20,17,.92)'; g.lineWidth = 3; g.stroke(); } }
function strokeP(g, c, w) { g.strokeStyle = c; g.lineWidth = w; g.stroke(); }
function line(g, x1, y1, x2, y2, c, w) { g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.strokeStyle = c; g.lineWidth = w; g.lineCap = 'round'; g.stroke(); }
function capsule(g, x1, y1, x2, y2, w, c) { g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.strokeStyle = c; g.lineWidth = w; g.lineCap = 'round'; g.stroke(); }

const FONT = '"Fredoka", "Baloo 2", "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif';
function text(g, s, x, y, o) {
  o = o || {};
  const sz = o.size || 28;
  g.font = (o.weight || 600) + ' ' + sz + 'px ' + FONT;
  g.textAlign = o.align || 'center'; g.textBaseline = o.base || 'middle';
  if (o.stroke) { g.lineJoin = 'round'; g.lineWidth = o.sw || 6; g.strokeStyle = o.stroke; g.strokeText(s, x, y); }
  g.fillStyle = o.color || '#3b2f2a'; g.fillText(s, x, y);
}
function wrapLines(g, s, maxW, size, weight) {
  g.font = (weight || 500) + ' ' + size + 'px ' + FONT;
  const words = s.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (g.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); return lines;
}
function para(g, s, x, y, maxW, o) {
  o = o || {}; const size = o.size || 24, lh = o.lh || size * 1.3;
  const ls = wrapLines(g, s, maxW, size, o.weight || 500);
  ls.forEach((l, i) => text(g, l, x, y + i * lh, Object.assign({}, o, { size, weight: o.weight || 500 })));
  return ls.length * lh;
}

/* ============ Save data ============ */
const SAVE_KEY = 'monaXmas.v3';
let save = { done: {}, paws: {}, outfit: 'santa', seenIntro: false, story: -1, played: {}, modes: { pong: 'mona', pac: 'mona', tetris: 'mona' } };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY)); if (s) save = Object.assign(save, s); } catch (e) { }
function persist() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) { } }
const TOTAL_PAWS = 12;
function pawCount() { return Object.keys(save.paws).length; }
const OUTFITS = [
  { id: 'none', name: 'Just Mona' }, { id: 'santa', name: 'Santa Hat' }, { id: 'antlers', name: 'Reindeer Antlers' },
  { id: 'elf', name: 'Little Elf' }, { id: 'jumper', name: 'Christmas Jumper' }, { id: 'collar', name: 'Jingle Bell Collar' },
  { id: 'scarf', name: 'Snowflake Scarf' }, { id: 'gingerbread', name: 'Gingerbread' }, { id: 'angel', name: 'Little Angel' }
];
function outfitOk(id) { return !!OUTFITS.find(o => o.id === id); }
function curOutfit() { return outfitOk(save.outfit) ? save.outfit : 'none'; }
function markDone(id) { save.done[id] = true; persist(); }
function collectPaw(id, x, y) {
  if (save.paws[id]) return false;
  save.paws[id] = true; persist(); if (PAUSABLE.includes(sceneName)) addPts(100, x, y - 40, 'Paw print!', true);
  audio.sfx('chime'); spawn('sparkle', x, y, 14);
  toast('Hidden paw print!  ' + pawCount() + ' / ' + TOTAL_PAWS);
  return true;
}

/* ============ Particles ============ */
const particles = [];
const PCOL = ['#e2443b', '#f2c14e', '#3a9a5b', '#4f8fd6', '#f08fb3', '#ffffff'];
let spawnXf = null; // set by zoomable scenes: maps world points to the screen
function spawn(type, x, y, n, o) {
  n = n || 1; if (spawnXf) { const q = spawnXf(x, y); x = q.x; y = q.y; }
  for (let i = 0; i < n; i++) {
    const p = { type, x, y, vx: rand(-70, 70), vy: rand(-170, -70), g: 0, life: 0, max: rand(.9, 1.5), rot: rand(0, TAU), vr: rand(-4, 4), s: rand(.7, 1.2), col: pick(PCOL) };
    if (type === 'heart') { p.vx = rand(-40, 40); p.vy = rand(-120, -70); p.col = pick(['#e2443b', '#f06b8b', '#ff8fa8']); p.max = rand(1, 1.6); }
    if (type === 'confetti') { p.vx = rand(-320, 320); p.vy = rand(-520, -180); p.g = 520; p.max = rand(1.6, 2.4); }
    if (type === 'sparkle') { const a = rand(0, TAU), sp = rand(60, 220); p.vx = Math.cos(a) * sp; p.vy = Math.sin(a) * sp; p.col = pick(['#fff3b0', '#ffd84d', '#ffffff']); p.max = rand(.5, .9); }
    if (type === 'note') { p.vx = rand(-30, 30); p.vy = rand(-90, -60); p.col = pick(['#7c5aa6', '#c8453b', '#3a7d5a']); }
    if (type === 'pop') { p.max = 3.2; p.vx = 0; }
    if (type === 'zzz') { p.vx = rand(10, 30); p.vy = -40; p.max = 2; p.col = '#7a88c9'; }
    if (type === 'dust') { p.vx = rand(-90, 90); p.vy = rand(-60, -10); p.col = 'rgba(200,190,180,.8)'; p.max = rand(.4, .7); }
    Object.assign(p, o || {});
    particles.push(p);
  }
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i]; p.life += dt;
    if (p.life >= p.max) { particles.splice(i, 1); continue; }
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
    if (p.type === 'confetti') { p.vx *= (1 - 1.2 * dt); }
    if (p.type === 'sparkle') { p.vx *= (1 - 3 * dt); p.vy *= (1 - 3 * dt); }
    if (p.type === 'pop') p.vy *= (1 - 2.2 * dt);
  }
}
function drawHeart(g, x, y, s, col) {
  g.save(); g.translate(x, y); g.scale(s, s);
  g.beginPath(); g.moveTo(0, 6);
  g.bezierCurveTo(-14, -4, -10, -16, 0, -9);
  g.bezierCurveTo(10, -16, 14, -4, 0, 6);
  g.fillStyle = col; g.fill(); g.restore();
}
function drawStar(g, x, y, r, col, pts) {
  pts = pts || 5; g.beginPath();
  for (let i = 0; i < pts * 2; i++) { const a = -Math.PI / 2 + i * Math.PI / pts, rr2 = i % 2 ? r * .45 : r; g.lineTo(x + Math.cos(a) * rr2, y + Math.sin(a) * rr2); }
  g.closePath(); g.fillStyle = col; g.fill();
}
function drawParticles(g) {
  for (const p of particles) {
    const k = p.life / p.max, a = k < .7 ? 1 : 1 - (k - .7) / .3;
    g.globalAlpha = clamp(a, 0, 1);
    if (p.type === 'heart') drawHeart(g, p.x, p.y, p.s * 1.4 * (0.6 + 0.4 * E.back(k * 3)), p.col);
    else if (p.type === 'confetti') { g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.scale(1, Math.cos(p.life * 9)); g.fillStyle = p.col; g.fillRect(-6, -3.5, 12, 7); g.restore(); }
    else if (p.type === 'sparkle') drawStar(g, p.x, p.y, 7 * p.s * (1 - k * .5), p.col, 4);
    else if (p.type === 'note') { g.save(); g.translate(p.x, p.y); g.rotate(Math.sin(p.life * 4) * .3); circ(g, 0, 0, 6); fillP(g, p.col); line(g, 5, 0, 5, -20, p.col, 3); g.restore(); }
    else if (p.type === 'zzz') text(g, 'z', p.x, p.y, { size: 22 + p.life * 14, color: p.col, weight: 700 });
    else if (p.type === 'dust') { circ(g, p.x, p.y, 5 * p.s * (1 + k)); fillP(g, p.col); }
    else if (p.type === 'pop') text(g, p.label, p.x, p.y, { size: p.size || 30, color: p.col, weight: 700, stroke: '#fff', sw: 6 });
  }
  g.globalAlpha = 1;
}

/* ============ Snow (stateless) ============ */
function drawSnow(g, x, y, w, h, t, n, size) {
  size = size || 1; g.fillStyle = 'rgba(255,255,255,.9)';
  for (let i = 0; i < n; i++) {
    const s1 = (i * 0.6180339) % 1, s2 = (i * 0.4142135 + .3) % 1, sp = 30 + s2 * 40;
    const yy = (s2 * h + t * sp) % h;
    const xx = (s1 * w + Math.sin(t * .8 + i) * 12 + w) % w;
    circ(g, x + xx, y + yy, (1.5 + s1 * 2.5) * size); g.fill();
  }
}

/* ============ Toasts ============ */
const toasts = [];
function toast(msg) { toasts.push({ msg, t: 0 }); }
function drawToasts(dt) {
  if (!toasts.length) return;
  const tt = toasts[0]; tt.t += dt;
  const dur = 3.8, k = tt.t;
  const inK = E.back(k / .4), outK = k > dur - .35 ? E.out((k - (dur - .35)) / .35) : 0;
  const y = -70 + 110 * inK - 110 * outK;
  ctx.save(); ctx.font = '600 26px ' + FONT;
  const w = ctx.measureText(tt.msg).width + 70;
  ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 4;
  rr(ctx, W / 2 - w / 2, y, w, 56, 28); fillP(ctx, '#fffaf0');
  ctx.restore();
  drawPaw(ctx, W / 2 - w / 2 + 34, y + 28, .9, '#c8453b');
  text(ctx, tt.msg, W / 2 + 14, y + 29, { size: 24, color: '#3b2f2a' });
  if (tt.t > dur) toasts.shift();
}
function drawPaw(g, x, y, s, col) {
  g.save(); g.translate(x, y); g.scale(s, s); g.fillStyle = col;
  ell(g, 0, 5, 9, 7.5); g.fill();
  ell(g, -9, -5, 3.6, 4.5, -.3); g.fill(); ell(g, -3, -10, 3.6, 4.8); g.fill();
  ell(g, 4, -10, 3.6, 4.8); g.fill(); ell(g, 10, -4, 3.6, 4.5, .3); g.fill();
  g.restore();
}

/* ============ Immediate-mode UI ============ */
const UI = {
  regions: [], next: [], pressed: null,
  button(id, x, y, w, h, draw, cb) {
    this.next.push({ id, x, y, w, h, cb });
    ctx.save();
    if (this.pressed === id) { ctx.translate(x + w / 2, y + h / 2); ctx.scale(.94, .94); ctx.translate(-x - w / 2, -y - h / 2); }
    draw(); ctx.restore();
  },
  hit(x, y) { for (let i = this.regions.length - 1; i >= 0; i--) { const r = this.regions[i]; if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return r; } return null; },
  press(x, y) { const r = this.hit(x, y); this.pressed = r ? r.id : null; return !!r; },
  release(x, y) { const id = this.pressed; this.pressed = null; if (id === null) return false; const r = this.hit(x, y); if (r && r.id === id) { audio.sfx('click'); r.cb(); } return true; }
};
function btn_v1(id, x, y, w, h, label, cb, o) {
  o = o || {};
  UI.button(id, x, y, w, h, () => {
    ctx.save(); ctx.shadowColor = 'rgba(60,30,20,.3)'; ctx.shadowBlur = 14; ctx.shadowOffsetY = 6;
    rr(ctx, x, y, w, h, o.r || h / 2); fillP(ctx, o.color || '#c8453b'); ctx.restore();
    rr(ctx, x + 5, y + 4, w - 10, h * .42, (o.r || h / 2) - 4); fillP(ctx, 'rgba(255,255,255,.16)');
    text(ctx, label, x + w / 2, y + h / 2 + 2, { size: o.size || Math.round(h * .42), color: o.tc || '#fff', weight: 600 });
  }, cb);
}
function iconBtn(id, x, y, r, glyph, cb, col) {
  UI.button(id, x - r, y - r, r * 2, r * 2, () => {
    ctx.save(); ctx.shadowColor = 'rgba(40,20,10,.3)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 4;
    circ(ctx, x, y, r); fillP(ctx, col || 'rgba(255,250,240,.95)'); ctx.restore();
    glyph(x, y);
  }, cb);
}
function glyphHome(x, y) {
  // little snowy gingerbread house with a wreath on the door
  const g = ctx; g.save(); g.translate(x, y + 2);
  g.lineJoin = 'round'; g.lineCap = 'round';
  rr(g, 7, -18, 7, 12, 1.5); g.fillStyle = '#b5532f'; g.fill(); g.strokeStyle = '#3d2a22'; g.lineWidth = 2; g.stroke();
  g.beginPath(); g.moveTo(-16, 15); g.lineTo(-16, -1); g.lineTo(16, -1); g.lineTo(16, 15); g.closePath(); g.fillStyle = '#d9894a'; g.fill(); g.stroke();
  g.beginPath(); g.moveTo(-20, 1); g.lineTo(0, -17); g.lineTo(20, 1); g.closePath(); g.fillStyle = '#c8453b'; g.fill(); g.stroke();
  g.beginPath(); g.moveTo(-21, 2); g.quadraticCurveTo(-11, -4, -6, -9); g.quadraticCurveTo(-3, -5, 0, -14); g.quadraticCurveTo(4, -6, 7, -8); g.quadraticCurveTo(13, -2, 21, 2); g.quadraticCurveTo(11, 5, 0, 3); g.quadraticCurveTo(-11, 5, -21, 2); g.closePath(); g.fillStyle = '#ffffff'; g.fill(); g.lineWidth = 1.6; g.stroke();
  rr(g, -5, 4, 10, 11, 4); g.fillStyle = '#7a3b2e'; g.fill();
  g.beginPath(); g.arc(0, 8, 3.4, 0, TAU); g.strokeStyle = '#2f9a52'; g.lineWidth = 2; g.stroke();
  g.fillStyle = '#ffd34d'; rr(g, -13, 4, 6, 6, 1.5); g.fill(); rr(g, 7, 4, 6, 6, 1.5); g.fill();
  g.fillStyle = '#fff'; for (const xx of [-14, -8, 8, 14]) { g.beginPath(); g.arc(xx, 15, 1.4, 0, TAU); g.fill(); }
  g.restore();
}
function glyphMusic(x, y) {
  const on = !audio.muted;
  ctx.fillStyle = '#7a3b2e'; ell(ctx, x - 7, y + 9, 6, 5, -.3); ctx.fill(); ell(ctx, x + 9, y + 6, 6, 5, -.3); ctx.fill();
  line(ctx, x - 2, y + 8, x - 2, y - 13, '#7a3b2e', 4); line(ctx, x + 14, y + 5, x + 14, y - 16, '#7a3b2e', 4); line(ctx, x - 2, y - 13, x + 14, y - 16, '#7a3b2e', 5);
  if (!on) line(ctx, x - 17, y - 17, x + 19, y + 17, '#c8453b', 5);
}

/* ============ Scene manager ============ */
const SCENES = {};
let scene = null, sceneName = '', sceneParams = {};
const fade = { a: 1, dir: -1, next: null };
function go(name, params) { if (fade.dir === 1) return; fade.dir = 1; fade.next = [name, params || {}]; }
function setScene(name, params) {
  if (scene && scene.exit) scene.exit();
  cacheStore.clear(); particles.length = 0;
  sceneName = name; sceneParams = params || {}; scene = SCENES[name]; scene.t = 0; scene.res = null; paused = false; howCard = null; spawnXf = null; scoreReset(); GAME.cats = {}; resetGoal();
  input.down = false;
  if (scene.enter) scene.enter(sceneParams);
  howToast = null; if (HOWTO[name] && SCENES[name].toastHow) showToast(name); else if (HOWTO[name] && !SCENES[name].lateHow) showHow(name);
}
function drawHUD_v1() {
  if (scene.home !== false) iconBtn('hud-home', 52, 50, 32, PAUSABLE.includes(sceneName) ? glyphPause : glyphHome, () => { if (PAUSABLE.includes(sceneName) && !paused) { paused = true; audio.sfx('click'); } else go('home'); });
  iconBtn('hud-music', W - 52, 50, 32, glyphMusic, () => audio.toggle());
}

/* ============ Input ============ */
const input = { down: false, x: 0, y: 0, sx: 0, sy: 0, t0: 0, moved: 0, id: null, ui: false };
function toLogical(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audio.unlock();

  circ(g, -7, -2, 2); fillP(g, '#3b2f2a'); g.restore();
}
function iconYarn(g, x, y, s, col) {
  g.save(); g.translate(x, y); g.scale(s, s);
  circ(g, 0, 0, 13); fillP(g, col || '#d0392f');
  g.save(); circ(g, 0, 0, 13); g.clip(); for (let i = -2; i <= 2; i++) { g.beginPath(); g.ellipse(i * 5, 0, 4, 16, .5, 0, TAU); strokeP(g, 'rgba(255,255,255,.35)', 1.6); } g.restore();
  g.beginPath(); g.moveTo(10, 8); g.quadraticCurveTo(22, 14, 18, 22); strokeP(g, col || '#d0392f', 2.5); g.restore();
}
function iconBolt(g, x, y, s, col) { g.save(); g.translate(x, y); g.scale(s, s); g.beginPath(); g.moveTo(4, -14); g.lineTo(-8, 2); g.lineTo(0, 2); g.lineTo(-4, 14); g.lineTo(8, -2); g.lineTo(0, -2); g.closePath(); fillP(g, col || '#f2c14e'); g.restore(); }
function iconMoon(g, x, y, s) { g.save(); g.translate(x, y); g.scale(s, s); circ(g, 0, 0, 12); fillP(g, '#f6e7a6'); circ(g, 6, -4, 10); fillP(g, '#2f3766'); g.restore(); }

function bubble(g, x, y, w, h, tailX, tailDir) {
  g.save(); g.shadowColor = 'rgba(40,20,10,.22)'; g.shadowBlur = 10; g.shadowOffsetY = 4;
  rr(g, x - w / 2, y - h / 2, w, h, Math.min(h / 2, 22)); fillP(g, '#fffdf8');

}
function speech(g, msg, x, y, t0, t, maxW) {

  const lines = wrapLines(g, msg, maxW || 300, 24, 600);

  bubble(g, 0, -h / 2, w, h, 0, 1);

   - Stars come from how much Catwatch Samantha had to sit through.
